# Pings the Render free instance so a visitor does not meet a cold start.
#
# MEASURED 2026-10-23, AND IT DOES NOT WORK ON ITS OWN. The schedule below
# asks for every 10 minutes. The last 15 runs actually fired every 242
# minutes on average, with one gap of 350 minutes — against a Render
# instance that sleeps after 15. The backend is therefore asleep for the
# large majority of the day, and a request to it was measured at 44
# seconds while every single run of this workflow reported success.
#
# That is GitHub's documented behaviour, not a bug here: scheduled
# workflows on shared runners are delayed under load and dropped
# entirely when the queue is long. `*/10` is a wish, not a guarantee.
#
# So this job no longer claims to keep anything awake. It pings, and it
# REPORTS whether the instance was already warm — which turns a workflow
# that always said "success" into one that says what actually happened.
# A green tick that means nothing is worse than no workflow at all.
#
# The real fix is one of two things, both outside this file:
#   * an external cron (cron-job.org and similar are free and fire on
#     time), which is needed anyway to trigger POST /push/market-sweep —
#     one job solves both problems; or
#   * Render's paid tier, which does not sleep.
name: Keep backend awake

on:
  schedule:
    - cron: "*/10 * * * *"   # aspirational; see the measurement above
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health and report whether it was already awake
        run: |
          URL="https://lumos-api-yowm.onrender.com/health"

          # A warm instance answers in well under a second; a sleeping one
          # takes tens of seconds to boot. The FIRST ping is the only
          # honest measurement — every later one is warm because of this
          # one.
          start=$(date +%s)
          body=$(curl -sf --max-time 90 "$URL") || body=""
          elapsed=$(( $(date +%s) - start ))

          if [ -z "$body" ]; then
            # A single miss is not an outage: a redeploy takes the service
            # down for a minute. Retry before saying anything alarming.
            for attempt in 2 3 4; do
              sleep 30
              if body=$(curl -sf --max-time 90 "$URL"); then break; fi
            done
          fi

          if [ -z "$body" ]; then
            echo "::error::Backend did not answer /health across 4 attempts (~6 min)."
            exit 1
          fi

          echo "answered in ${elapsed}s"
          echo "$body"

          if [ "$elapsed" -gt 10 ]; then
            echo "::warning::Instance was ASLEEP — it took ${elapsed}s to answer, \
          so a visitor arriving just before this run waited that long. This workflow \
          is not firing often enough to prevent that; see the comment at the top."
            echo "### ⚠️ Was asleep (${elapsed}s cold start)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ✅ Already warm (${elapsed}s)" >> "$GITHUB_STEP_SUMMARY"
          fi
