<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Home-screen icon: the brand firefly on a night square (180x180 PNG for
         iOS; the SVG covers browsers that prefer it). Was a page screenshot. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- PWA / Mobile appearance -->
    <meta name="theme-color" content="#0C0D14" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lumos" />

    <!-- SEO -->
    <title>Lumos — Smart Investment Assistant</title>
    <meta name="description" content="Korkusuz, öğrenerek yatırım: yapay zeka destekli risk profili, şeffaf portföy önerisi, emlak + borsa tek çatıda. Eğitim amaçlıdır." />

    <!-- Social sharing (Open Graph) -->
    <meta property="og:title" content="Lumos — Akıllı Yatırım Asistanı" />
    <meta property="og:description" content="Korkusuz, öğrenerek yatırım: şeffaf risk profili ve portföy rehberi." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icon-512.png" />

    <!-- Single viewport tag: mobile-first + safe-area for notched phones -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!--
      First paint, before any JavaScript runs. The page background used to be
      white until React mounted, which on a phone reads as a broken load on a
      dark app — and the app now waits for the reader's locale before its
      first render, so that gap became visible. Inline and tiny on purpose:
      an external file would need the very round trip this is covering.
    -->
    <style>
      html, body { margin: 0; background: #0C0D14; color-scheme: dark; }
      #splash {
        position: fixed; inset: 0; display: flex;
        align-items: center; justify-content: center;
        background: #0C0D14;
      }
      #splash span {
        width: 14px; height: 14px; border-radius: 50%;
        background: #F5A524; box-shadow: 0 0 18px 4px rgba(245, 165, 36, 0.45);
        animation: splash-pulse 1.4s ease-in-out infinite;
      }
      @keyframes splash-pulse {
        0%, 100% { opacity: 0.35; transform: scale(0.85); }
        50%      { opacity: 1;    transform: scale(1.1); }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash span { animation: none; opacity: 0.9; }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true"><span></span></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
